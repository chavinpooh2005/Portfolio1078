<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Blogger</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    <div class="container">
        <h1 id="top"></h1>
        
        <div class="post-card topic-card">
            <span class="label">Topic</span>
            <div id="topic"></div>
        </div>
        
        <div class="post-card reply-card">
            <span class="label">Reply 1</span>
            <div id="reply1"></div>
        </div>
        
        <div class="post-card reply-card">
            <span class="label">Reply 2</span>
            <div id="reply2"></div>
        </div>
        
        <div class="form-group">
            <textarea name="message" id="message" placeholder="พิมพ์ข้อความของคุณที่นี่..."></textarea> 
            <div class="button-group">
                <button type="button" onclick="postFunction()">Post</button>
                <button type="button" class="btn-clear" onclick="clearFunction()">Clear</button>
            </div>
        </div>
    </div>
</body>
</html>
